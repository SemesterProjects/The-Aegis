[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "Cross-platform, safety-governed endpoint monitoring core"
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# Retained so existing documented `.[enhanced,test]` commands remain valid.
# Process/network collection and native file watching are core dependencies.
enhanced = []
test = ["pytest>=8"]

[project.scripts]
aegis = "aegis_core.__main__:main"

[tool.setuptools.packages.find]
include = ["aegis_core*", "network_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests", "network_monitor/tests"]
python_files = ["test_*.py"]
